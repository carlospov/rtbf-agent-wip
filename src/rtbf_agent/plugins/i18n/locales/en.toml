# Jurisdiction/drafting-language review-and-override from the kanban web UI (api/case_overrides.py)
# -- the review path for a no-prompt-at-creation reversal (see cli.py's module docstring): a
# detected jurisdiction suggestion is now auto-applied with no prompt at case creation, and the
# case-detail page is where a human reviews or overrides it (or sets drafting language from
# scratch), only while the case is still Discovered. "not_found"/"wrong_state"/"invalid_*" are the
# two routes' error bodies; the rest are the case-detail page's summary/form copy (case_detail.
# jurisdiction_label/drafting_language_label also render the current value in the always-visible
# case summary, not just inside the edit forms below).
"case_overrides.not_found" = "Case not found"
"case_overrides.wrong_state" = "Case {case_id} is no longer 'Discovered' -- jurisdiction/drafting language can't be changed once a case has been classified"
"case_overrides.invalid_jurisdiction" = "Jurisdiction must be non-empty"
"case_overrides.invalid_drafting_language" = "Drafting language must be non-empty"
"case_detail.case_overrides_heading" = "Review or override this case's jurisdiction/drafting language"
"case_detail.jurisdiction_label" = "Applicable jurisdiction:"
"case_detail.jurisdiction_input_label" = "Applicable jurisdiction"
"case_detail.jurisdiction_set_button" = "Set jurisdiction"
"case_detail.jurisdiction_hint" = "Only editable while this case is still 'Discovered'. Blank here just means no per-case override is set yet -- the global default applies until you set one."
"case_detail.drafting_language_label" = "Drafting language:"
"case_detail.drafting_language_input_label" = "Drafting language"
"case_detail.drafting_language_set_button" = "Set drafting language"
"case_detail.drafting_language_hint" = "Only editable while this case is still 'Discovered'. Blank here just means no per-case override is set yet -- the global default applies until you set one."

