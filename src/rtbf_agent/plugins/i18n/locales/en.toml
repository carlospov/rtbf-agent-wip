# English (en) resource strings for `ResourceI18nProvider`.
#
# Flat key -> string table. Keys are dotted for readability only; the loader treats them as
# opaque strings, not a nested structure -- so "case.status_notice" and "case_status_notice"
# behave identically. Values may contain `{param}`-style placeholders, filled in via
# `str.format(**params)` at `translate()` time (R23).

greeting = "Hello, {name}!"
"case.status_notice" = "Case {case_id} is now {status}."

# Telegram bot copy (plugins/notifiers/telegram.py, #14) -- notify-only after the automated-case-
# loop rework; every user-facing string that module sends is resolved from this key; see
# tests/plugins/notifiers/test_telegram.py::test_no_literal_user_facing_strings_in_bot_or_kanban_code.
"telegram.notification" = "Case {case_id}: {text}"

